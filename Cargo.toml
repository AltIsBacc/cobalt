[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["AltIsBacc"]
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
cobalt-format = { path = "crates/format" }
cobalt-protocol = { path = "crates/protocol" }
cobalt-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
uuid = "1"
num_enum = "0.7"
enumflags2 = "0.7"
derive_more = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
flate2 = "1"
rayon = "1"
rustyrepl = { version = "0.2", features = ["async"] }
inquire = "0.9"
